<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Split Log"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Split Log · Gym Tracker</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171f33;--line:#303a51;--text:#f5f7ff;--muted:#9eabc4;--accent:#77e0c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:4px 0 6px}h2{font-size:20px;margin:4px 0 14px}.muted,small{color:var(--muted)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:15px 0}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0 14px}.tabs button{flex:1;white-space:nowrap}button,.button{border:1px solid var(--line);background:#263149;color:var(--text);border-radius:11px;padding:11px 13px;font:inherit;font-weight:650;cursor:pointer}button.active,button.primary{background:var(--accent);color:#0a1722;border-color:var(--accent)}button:disabled{opacity:.5}input{background:#0d1425;color:white;border:1px solid #47536d;border-radius:9px;padding:11px;width:100%;font:inherit}input[type=number]{min-width:0}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.exercise{border-top:1px solid var(--line);padding:15px 0}.exercise:first-of-type{border-top:0}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.exhead strong{font-size:16px}.setrow{display:grid;grid-template-columns:35px 1fr 1fr 45px;gap:8px;align-items:end;margin:9px 0}.setrow label{margin:0}.setrow button{padding:11px 5px}.done{background:#1c5a50!important;color:white}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:30px;font-size:12px;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:9px}.toolbar button{flex:1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .card{margin:0}.big{font-size:27px;font-weight:800}.historyrow{border-top:1px solid var(--line);padding:12px 0}.historyrow:first-child{border-top:0}#notice{min-height:18px;color:var(--accent);font-size:12px;margin-top:10px}.note{line-height:1.5}footer{font-size:12px;color:var(--muted);margin-top:20px}a{color:var(--accent)}
</style></head><body><main><header><div><div class="eyebrow">YOUR TRAINING COMPANION</div><h1>SPLIT LOG</h1><div class="muted">4-day strength plan · private on this device</div></div><span class="pill">v1.0</span></header><div id="notice" role="status"></div><nav class="tabs" aria-label="Sections"><button data-tab="workout" class="active">Workout</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="settings">Settings</button></nav><div id="app"></div><footer>Train with control. Stop if dizzy or unusually sleepy. Your workout data is saved in this browser only; export a backup regularly.</footer></main><script>
(function(){'use strict';
var plan=[{name:'Chest & Triceps',ex:[['Chest Press Machine',3,'8–12'],['Incline Dumbbell Press',3,'8–12'],['Pec Deck',3,'10–12'],['Seated Shoulder Press',2,'10–12'],['Rope Triceps Pushdown',3,'10–15'],['Light Romanian Deadlift (optional)',1,'10']]},{name:'Back & Biceps',ex:[['Lat Pulldown',3,'8–12'],['Seated Cable Row',3,'10–12'],['Chest-Supported Dumbbell Row',2,'10–12'],['Face Pulls',2,'12–15'],['Dumbbell Biceps Curl',3,'10–12'],['Hammer Curl',2,'10–12']]},{name:'Legs & RDL',ex:[['Romanian Deadlift',3,'8–10'],['Leg Press',3,'10–12'],['Seated Hamstring Curl',3,'10–12'],['Leg Extension',2,'12–15'],['Standing Calf Raise',2,'12–15'],['Cable Abdominal Crunch',2,'12–15']]},{name:'Upper Body',ex:[['Incline Chest Press Machine',3,'10–12'],['Neutral-Grip Lat Pulldown',3,'10–12'],['Dumbbell Lateral Raise',3,'12–15'],['Seated Cable Row',2,'10–12'],['Cable Biceps Curl',2,'12–15'],['Rope Triceps Extension',2,'12–15'],['Light RDL Technique (optional)',1,'10']]}];
var key='splitlog-pwa-v1',db={sessions:[],drafts:{},day:0},tab='workout';try{var saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.sessions)){db=saved;db.drafts=db.drafts||{};db.day=Math.max(0,Math.min(3,Number(db.day)||0));}}catch(e){};
function persist(){try{localStorage.setItem(key,JSON.stringify(db));document.getElementById('notice').textContent='Saved on this device';}catch(e){document.getElementById('notice').textContent='Storage unavailable. Export your records when possible.';}}
function el(id){return document.getElementById(id)}function escape(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function exKey(day,i){return day+'-'+i}function draft(day,i,j){var k=exKey(day,i);return db.drafts[k]&&db.drafts[k][j]||{kg:'',reps:'',done:false}}function last(ex){for(var i=db.sessions.length-1;i>=0;i--){for(var j=0;j<db.sessions[i].exercises.length;j++){var a=db.sessions[i].exercises[j];if(a.name===ex&&a.sets.length)return a;}}return null}function pb(ex){var best=0;db.sessions.forEach(function(s){s.exercises.forEach(function(a){if(a.name===ex)a.sets.forEach(function(x){best=Math.max(best,Number(x.kg)||0)})})});return best}
function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab)});if(tab==='workout')workout();if(tab==='history')history();if(tab==='progress')progress();if(tab==='settings')settings();}
function workout(){var d=db.day,p=plan[d],html='<div class="card"><div class="eyebrow">TODAY’S PLAN</div><h2>Day '+(d+1)+' · '+p.name+'</h2><div class="toolbar">';plan.forEach(function(x,i){html+='<button data-day="'+i+'" class="'+(i===d?'active':'')+'">Day '+(i+1)+'</button>'});html+='</div><p class="muted note">Enter your actual weight and reps, tick completed sets, then save your workout. Keep 2–3 reps in reserve while returning to training.</p></div><div class="card">';p.ex.forEach(function(x,i){var l=last(x[0]),b=pb(x[0]);html+='<section class="exercise"><div class="exhead"><strong>'+escape(x[0])+'</strong><span class="pill">'+x[1]+' × '+x[2]+'</span></div><small>Last: '+(l?escape(l.sets.map(function(s){return s.kg+' kg × '+s.reps}).join(', ')):'—')+' · PB: '+(b?b+' kg':'—')+'</small>';for(var j=0;j<x[1];j++){var s=draft(d,i,j);html+='<div class="setrow"><span class="muted">#'+(j+1)+'</span><div><label>Weight (kg)</label><input aria-label="'+escape(x[0])+' set '+(j+1)+' weight in kg" data-edit="kg" data-i="'+i+'" data-j="'+j+'" type="number" inputmode="decimal" step="0.5" min="0" value="'+escape(s.kg)+'"></div><div><label>Reps</label><input aria-label="'+escape(x[0])+' set '+(j+1)+' reps" data-edit="reps" data-i="'+i+'" data-j="'+j+'" type="number" inputmode="numeric" step="1" min="0" value="'+escape(s.reps)+'"></div><button aria-label="Mark set complete" data-check="1" data-i="'+i+'" data-j="'+j+'" class="'+(s.done?'done':'')+'">'+(s.done?'✓':'○')+'</button></div>'}html+='</section>'});html+='</div><button id="save" class="primary" style="width:100%;padding:16px">Save completed workout</button>';el('app').innerHTML=html;}
function history(){var html='<h2>Workout history</h2>';if(!db.sessions.length)html+='<div class="card muted">No workouts saved yet. Finish a workout to see it here.</div>';db.sessions.slice().reverse().forEach(function(s){html+='<div class="card"><strong>'+escape(s.dayName)+'</strong><div class="muted">'+escape(new Date(s.date).toLocaleString())+' · '+s.exercises.reduce(function(n,e){return n+e.sets.length},0)+' sets</div>';s.exercises.forEach(function(e){html+='<div class="historyrow"><strong>'+escape(e.name)+'</strong><div class="muted">'+escape(e.sets.map(function(x){return x.kg+' kg × '+x.reps}).join(' · '))+'</div></div>'});html+='</div>'});el('app').innerHTML=html;}
function progress(){var names={};db.sessions.forEach(function(s){s.exercises.forEach(function(e){e.sets.forEach(function(x){if(x.kg!==''&&Number(x.kg)>0)names[e.name]=Math.max(names[e.name]||0,Number(x.kg))})})});var html='<h2>Your progress</h2><div class="summary"><div class="card"><div class="big">'+db.sessions.length+'</div><small>Workouts saved</small></div><div class="card"><div class="big">'+Object.keys(names).length+'</div><small>Exercises with PBs</small></div></div><div class="card"><h2>Personal bests</h2>';if(!Object.keys(names).length)html+='<p class="muted">Your heaviest logged weight for each exercise will appear here.</p>';Object.keys(names).sort().forEach(function(n){html+='<div class="historyrow"><strong>'+escape(n)+'</strong><div class="muted">'+names[n]+' kg</div></div>'});el('app').innerHTML=html+'</div>';}
function settings(){el('app').innerHTML='<div class="card"><h2>Back up your workouts</h2><p class="muted note">Data stays on this iPhone/browser, not in GitHub. Safari data clearing or changing devices may erase it. Export regularly and save the JSON file in Files or iCloud Drive.</p><div class="toolbar"><button id="export" class="primary">Export backup</button><button id="import">Import backup</button></div><input id="file" type="file" accept=".json,application/json" style="display:none"></div><div class="card"><h2>How to install</h2><p class="muted note">Once hosted on GitHub Pages, open the website in Safari, tap Share, then Add to Home Screen. Offline access works after the first successful visit.</p></div><div class="card"><h2>About your plan</h2><p class="muted note">4 days/week · one leg day · upper-body emphasis. Optional RDL technique sets are light. Rest and safe driving come before late-night workouts when tired.</p></div>';}
function setDraft(i,j,field,value){var k=exKey(db.day,i);db.drafts[k]=db.drafts[k]||{};db.drafts[k][j]=db.drafts[k][j]||{kg:'',reps:'',done:false};db.drafts[k][j][field]=value;persist()}
document.addEventListener('input',function(e){if(e.target.hasAttribute('data-edit'))setDraft(+e.target.getAttribute('data-i'),+e.target.getAttribute('data-j'),e.target.getAttribute('data-edit'),e.target.value)});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab');render();return}if(b.hasAttribute('data-day')){db.day=+b.getAttribute('data-day');persist();render();return}if(b.hasAttribute('data-check')){var i=+b.getAttribute('data-i'),j=+b.getAttribute('data-j'),s=draft(db.day,i,j);setDraft(i,j,'done',!s.done);render();return}if(b.id==='save'){var p=plan[db.day],session={date:new Date().toISOString(),dayName:'Day '+(db.day+1)+' · '+p.name,exercises:[]},count=0;p.ex.forEach(function(x,i){var sets=[];for(var j=0;j<x[1];j++){var s=draft(db.day,i,j);if(s.done&&s.reps!==''&&Number(s.reps)>0&&s.kg!==''&&Number(s.kg)>=0){sets.push({kg:Number(s.kg),reps:Number(s.reps)});count++}}if(sets.length)session.exercises.push({name:x[0],sets:sets})});if(!count){alert('Tick at least one set and enter its weight and reps before saving.');return}db.sessions.push(session);p.ex.forEach(function(x,i){delete db.drafts[exKey(db.day,i)]});persist();tab='history';render();alert('Workout saved: '+count+' sets!');return}if(b.id==='export'){var a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);a.href=url;a.download='split-log-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);return}if(b.id==='import'){el('file').click();return}});
document.addEventListener('change',function(e){if(e.target.id!=='file'||!e.target.files.length)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!Array.isArray(data.sessions)||typeof data.drafts!=='object')throw Error('Invalid file');if(confirm('Replace your current workout data with this backup?')){db=data;db.day=Math.max(0,Math.min(3,Number(db.day)||0));persist();render()}}catch(err){alert('Could not read this Split Log backup.')}};reader.readAsText(e.target.files[0])});
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js').catch(function(){})})}render();
})();</script></body></html>
