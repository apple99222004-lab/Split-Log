:root{color-scheme:dark;--bg:#0b1020;--panel:#171f33;--line:#303a51;--text:#f5f7ff;--muted:#9eabc4;--accent:#77e0c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:4px 0 6px}h2{font-size:20px;margin:4px 0 14px}.muted,small{color:var(--muted)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:15px 0}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0 14px}.tabs button{flex:1;white-space:nowrap}button,.button{border:1px solid var(--line);background:#263149;color:var(--text);border-radius:11px;padding:11px 13px;font:inherit;font-weight:650;cursor:pointer}button.active,button.primary{background:var(--accent);color:#0a1722;border-color:var(--accent)}button:disabled{opacity:.5}input{background:#0d1425;color:white;border:1px solid #47536d;border-radius:9px;padding:11px;width:100%;font:inherit}input[type=number]{min-width:0}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.exercise{border-top:1px solid var(--line);padding:15px 0}.exercise:first-of-type{border-top:0}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.exhead strong{font-size:16px}.setrow{display:grid;grid-template-columns:35px 1fr 1fr 45px;gap:8px;align-items:end;margin:9px 0}.setrow label{margin:0}.setrow button{padding:11px 5px}.done{background:#1c5a50!important;color:white}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:30px;font-size:12px;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:9px}.toolbar button{flex:1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .card{margin:0}.big{font-size:27px;font-weight:800}.histo </style></head><body><main><header><div><div class="eyebrow">YOUR TRAINING COMPANION</div><h1>SPLIT LOG</h1><div class="muted">4-day strength plan · private on this device</div></div><span class="pill">v2.0</span></header><div id="notice" role="status"></div><div id="timer" class="timerbar" aria-live="polite"></div><nav class="tabs" aria-label="Sections"><button data-tab="workout" class="active">Workout</button><button data-tab="history">History</button><button data-tab="progress">Progress</button><button data-tab="calendar">Calendar</button><button data-tab="settings">Settings</button></nav><div id="app"></div><footer>Train with control. Stop if dizzy or unusually sleepy. Data stays on this device; export a backup regularly.</footer></main><script>
(function(){'use strict';
var defaults=[{name:'Chest & Triceps',ex:[['Chest Press Machine',3,'8–12'],['Incline Dumbbell Press',3,'8–12'],['Pec Deck',3,'10–12'],['Seated Shoulder Press',2,'10–12'],['Rope Triceps Pushdown',3,'10–15'],['Light Romanian Deadlift (optional)',1,'10']]},{name:'Back & Biceps',ex:[['Lat Pulldown',3,'8–12'],['Seated Cable Row',3,'10–12'],['Chest-Supported Dumbbell Row',2,'10–12'],['Face Pulls',2,'12–15'],['Dumbbell Biceps Curl',3,'10–12'],['Hammer Curl',2,'10–12']]},{name:'Legs & RDL',ex:[['Romanian Deadlift',3,'8–10'],['Leg Press',3,'10–12'],['Seated Hamstring Curl',3,'10–12'],['Leg Extension',2,'12–15'],['Standing Calf Raise',2,'12–15'],['Cable Abdominal Crunch',2,'12–15']]},{name:'Upper Body',ex:[['Incline Chest Press Machine',3,'10–12'],['Neutral-Grip Lat Pulldown',3,'10–12'],['Dumbbell Lateral Raise',3,'12–15'],['Seated Cable Row',2,'10–12'],['Cable Biceps Curl',2,'12–15'],['Rope Triceps Extension',2,'12–15'],['Light RDL Technique (optional)',1,'10']]}];
var KEY='splitlog-pwa-v1',db={sessions:[],drafts:{},day:0},tab='workout',managing=false,chartName='',monthOffset=0,timerEnd=0,timerHandle=null;
try{var saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.sessions)){db=saved;}}catch(e){}
function cleanPlan(p){return Array.isArray(p)&&p.length===4&&p.every(function(d){return d&&typeof d.name==='string'&&Array.isArray(d.ex)&&d.ex.every(function(x){return Array.isArray(x)&&typeof x[0]==='string'&&Number(x[1])>=1})})}
if(!cleanPlan(db.plan))db.plan=JSON.parse(JSON.stringify(defaults));if(!db.drafts||typeof db.drafts!=='object')db.drafts={};db.day=Math.max(0,Math.min(3,Number(db.day)||0));if(!Number.isFinite(db.restSeconds))db.restSeconds=90;db.restSeconds=Math.max(60,Math.min(120,db.restSeconds));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));el('notice').textContent='Saved on this device';}catch(e){el('notice').textContent='Storage unavailable — export a backup';}}
function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function exKey(d,i){return d+'-'+i}function draft(d,i,j){var a=db.drafts[exKey(d,i)];return a&&a[j]||{kg:'',reps:'',done:false}}function setsOf(a){return Array.isArray(a.sets)?a.sets:[]}function allSessions(){return db.sessions.filter(function(s){return s&&Array.isArray(s.exercises)})}function dateLocal(s){var d=new Date(s);return isNaN(d.getTime())?null:d}function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function last(name){var list=allSessions().slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)});for(var i=0;i<list.length;i++){for(var j=0;j<list[i].exercises.length;j++){var x=list[i].exercises[j];if(x.name===name&&setsOf(x).length)return x}}return null}function best(name){var b=0;allSessions().forEach(function(s){s.exercises.forEach(function(x){if(x.name===name)setsOf(x).forEach(function(y){b=Math.max(b,Number(y.kg)||0)})})});return b}
function lastSets(name){var x=last(name);return x?setsOf(x).map(function(s){return s.kg+'kg × '+s.reps}).join(' · '):'Not logged yet'}
function render(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab)});if(tab==='workout')workout();if(tab==='history')history();if(tab==='progress')progress();if(tab==='calendar')calendar();if(tab==='settings')settings();showTimer()}
function workout(){var d=db.day,p=db.plan[d],html='<div class="card"><div class="eyebrow">YOUR WORKOUT</div><h2>Day '+(d+1)+' · '+esc(p.name)+'</h2><div class="toolbar">';db.plan.forEach(function(x,i){html+='<button data-day="'+i+'" class="'+(i===d?'active':'')+'">Day '+(i+1)+'</button>'});html+='</div><p class="muted note">Log kg and reps, tick completed sets, then save. Previous weights are shown for each exercise.</p><button data-manage="1" class="secondary">'+(managing?'Done editing':'Edit exercises')+'</button></div>';
if(managing){html+='<div class="card"><h2>Manage Day '+(d+1)+'</h2><p class="muted tiny">Changes affect future workouts only. Past workout history is kept. Editing clears unsaved sets for this day.</p>';p.ex.forEach(function(x,i){html+='<div class="manageitem"><div class="exhead"><strong>'+esc(x[0])+'</strong><span class="pill">'+x[1]+' × '+esc(x[2])+'</span></div><div class="flex"><button data-move="up" data-i="'+i+'" '+(i===0?'disabled':'')+'>↑ Up</button><button data-move="down" data-i="'+i+'" '+(i===p.ex.length-1?'disabled':'')+'>↓ Down</button><button data-exedit="'+i+'">Edit / Replace</button><button data-remove="'+i+'">Remove</button></div></div>'});html+='<button class="primary" data-add="1">+ Add exercise</button> <button data-resetday="1">Restore original day</button></div>';el('app').innerHTML=html;return}
html+='<div class="card">';p.ex.forEach(function(x,i){var b=best(x[0]);html+='<section class="exercise"><div class="exhead"><strong>'+esc(x[0])+'</strong><span class="pill">'+x[1]+' × '+esc(x[2])+'</span></div><small class="lastline">Previous: '+esc(lastSets(x[0]))+'<br>PB: '+(b?b+' kg':'—')+'</small>';for(var j=0;j<x[1];j++){var s=draft(d,i,j);html+='<div class="setrow"><span class="muted">#'+(j+1)+'</span><div><label>Weight (kg)</label><input aria-label="'+esc(x[0])+' set '+(j+1)+' kg" data-edit="kg" data-i="'+i+'" data-j="'+j+'" type="number" inputmode="decimal" step="0.5" min="0" value="'+esc(s.kg)+'"></div><div><label>Reps</label><input aria-label="'+esc(x[0])+' set '+(j+1)+' reps" data-edit="reps" data-i="'+i+'" data-j="'+j+'" type="number" inputmode="numeric" step="1" min="0" value="'+esc(s.reps)+'"></div><button aria-label="Toggle completed set" data-check="1" data-i="'+i+'" data-j="'+j+'" class="'+(s.done?'done':'')+'">'+(s.done?'✓':'○')+'</button></div>'}html+='</section>'});html+='</div><button id="save" class="primary" style="width:100%;padding:16px">Save completed workout</button>';el('app').innerHTML=html}
function history(){var html='<h2>Workout history</h2>';if(!db.sessions.length)html+='<div class="card muted">No workouts saved yet.</div>';allSessions().slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)}).forEach(function(s){html+='<div class="card"><strong>'+esc(s.dayName)+'</strong><div class="muted">'+esc(dateLocal(s.date)?dateLocal(s.date).toLocaleString():s.date)+' · '+s.exercises.reduce(function(n,e){return n+setsOf(e).length},0)+' sets</div>';s.exercises.forEach(function(e){html+='<div class="historyrow"><strong>'+esc(e.name)+'</strong><div class="muted">'+esc(setsOf(e).map(function(x){return x.kg+' kg × '+x.reps}).join(' · '))+'</div></div>'});html+='</div>'});el('app').innerHTML=html}
function chartData(name){var out=[];allSessions().forEach(function(s){var highest=0;s.exercises.forEach(function(e){if(e.name===name)setsOf(e).forEach(function(x){highest=Math.max(highest,Number(x.kg)||0)})});if(highest>0){var d=dateLocal(s.date);if(d)out.push({date:d,kg:highest})}});return out.sort(function(a,b){return a.date-b.date})}
function chartSvg(data){if(!data.length)return '<p class="muted">Save workouts for this exercise to see a chart.</p>';var w=330,h=190,l=39,r=12,t=20,b=30,max=Math.max.apply(null,data.map(function(x){return x.kg})),min=Math.min.apply(null,data.map(function(x){return x.kg}));min=Math.max(0,Math.floor(min*.85));if(max<=min)max=min+1;var pts=data.map(function(x,i){return {x:l+(data.length===1?.5:i/(data.length-1))*(w-l-r),y:t+(max-x.kg)/(max-min)*(h-t-b)}}),poly=pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' '),html='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Weight trend chart">';for(var j=0;j<3;j++){var y=t+j*(h-t-b)/2,v=max-j*(max-min)/2;html+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="#3a455e"/><text x="'+(l-5)+'" y="'+(y+4)+'" fill="#aebbd3" font-size="10" text-anchor="end">'+v.toFixed(1)+'</text>'}html+='<polyline points="'+poly+'" fill="none" stroke="#77e0c4" stroke-width="3" stroke-linejoin="round"/>';pts.forEach(function(p){html+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#77e0c4"/>'});html+='<text x="'+l+'" y="'+(h-7)+'" fill="#aebbd3" font-size="10">'+esc(data[0].date.toLocaleDateString())+'</text><text x="'+(w-r)+'" y="'+(h-7)+'" fill="#aebbd3" font-size="10" text-anchor="end">'+esc(data[data.length-1].date.toLocaleDateString())+'</text></svg>';return html}
function progress(){var names={};allSessions().forEach(function(s){s.exercises.forEach(function(e){setsOf(e).forEach(function(x){if(Number(x.kg)>0)names[e.name]=Math.max(names[e.name]||0,Number(x.kg))})})});var arr=Object.keys(names).sort();if(!arr.includes(chartName))chartName=arr[0]||'';var weeks={};allSessions().forEach(function(s){var d=dateLocal(s.date);if(d){var k=dayKey(monday(d));weeks[k]=(weeks[k]||0)+1}});var lastFour=[];for(var i=3;i>=0;i--){var dt=monday(new Date());dt.setDate(dt.getDate()-7*i);lastFour.push({label:dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}),count:weeks[dayKey(dt)]||0})}var html='<h2>Your progress</h2><div class="summary"><div class="card"><div class="big">'+db.sessions.length+'</div><small>Workouts saved</small></div><div class="card"><div class="big">'+arr.length+'</div><small>Exercises with PBs</small></div></div><div class="card"><h2>Weight progression</h2>';if(arr.length){html+='<label for="chart-ex">Exercise</label><select id="chart-ex">';arr.forEach(function(n){html+='<option value="'+esc(n)+'" '+(n===chartName?'selected':'')+'>'+esc(n)+'</option>'});html+='</select><p class="muted tiny">Heaviest completed set per session (kg)</p>'+chartSvg(chartData(chartName))}else html+='<p class="muted">Your chart appears after saving completed weighted sets.</p>';html+='</div><div class="card"><h2>Last four weeks</h2><p class="muted tiny">Workouts per Monday–Sunday week · target 4</p>';lastFour.forEach(function(x){html+='<div class="statrow"><span>'+x.label+'</span><strong>'+x.count+' / 4</strong></div>'});html+='</div><div class="card"><h2>Personal bests</h2>';if(!arr.length)html+='<p class="muted">No personal bests yet.</p>';arr.forEach(function(n){html+='<div class="statrow"><span>'+esc(n)+'</span><strong>'+names[n]+' kg</strong></div>'});el('app').innerHTML=html+'</div>'}
function calendar(){var today=new Date(),base=new Date(today.getFullYear(),today.getMonth()+monthOffset,1),y=base.getFullYear(),m=base.getMonth(),days=new Date(y,m+1,0).getDate(),start=(base.getDay()+6)%7,counts={};allSessions().forEach(function(s){var d=dateLocal(s.date);if(d){var k=dayKey(d);counts[k]=(counts[k]||0)+1}});var weekStart=monday(today),weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);var weekCount=allSessions().filter(function(s){var d=dateLocal(s.date);return d&&d>=weekStart&&d<weekEnd}).length;var html='<h2>Workout calendar</h2><div class="card"><div class="exhead"><h2>'+base.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h2><div class="flex"><button class="compact" data-month="-1" aria-label="Previous month">←</button><button class="compact" data-month="0">Today</button><button class="compact" data-month="1" aria-label="Next month">→</button></div></div><div class="calendar">';['M','T','W','T','F','S','S'].forEach(function(n){html+='<div class="cell head">'+n+'</div>'});for(var a=0;a<start;a++)html+='<div class="cell empty"></div>';for(var n=1;n<=days;n++){var d=new Date(y,m,n),k=dayKey(d),c=counts[k]||0;html+='<div class="cell '+(c?'trained ':'')+(k===dayKey(today)?'today':'')+'">'+n+(c?'<span class="dot">'+c+' workout'+(c>1?'s':'')+'</span>':'')+'</div>'}html+='</div><p class="muted tiny">Green days = saved workouts. Calendar uses your device’s local dates.</p></div><div class="card"><h2>This week</h2><div class="big">'+weekCount+' / 4</div><p class="muted">'+esc(weekStart.toLocaleDateString())+' – '+esc(new Date(weekEnd.getTime()-86400000).toLocaleDateString())+'</p></div>';el('app').innerHTML=html}
function settings(){el('app').innerHTML='<div class="card"><h2>Rest timer</h2><p class="muted">Starts when you tick a set complete. Works while the app is open; it does not send notifications.</p><label for="rest-select">Countdown</label><select id="rest-select"><option value="60" '+(db.restSeconds===60?'selected':'')+'>60 seconds</option><option value="90" '+(db.restSeconds===90?'selected':'')+'>90 seconds</option><option value="120" '+(db.restSeconds===120?'selected':'')+'>120 seconds</option></select></div><div class="card"><h2>Back up your workouts</h2><p class="muted note">Your existing workout history and custom exercise plan are stored locally under the same Split Log storage key as v1.0. Export a backup BEFORE updating. Safari storage and Home Screen app storage may be separate.</p><div class="toolbar"><button id="export" class="primary">Export backup</button><button id="import">Import backup</button></div><input id="file" type="file" accept=".json,application/json" style="display:none"></div><div class="card"><h2>About your plan</h2><p class="muted">Four days per week, upper-body emphasis, one leg day. You can edit each day from the Workout tab. Past saved sessions stay unchanged when you edit exercises.</p></div>'}
function setDraft(i,j,field,value){var k=exKey(db.day,i);db.drafts[k]=db.drafts[k]||{};db.drafts[k][j]=db.drafts[k][j]||{kg:'',reps:'',done:false};db.drafts[k][j][field]=value;persist()}
function confirmEdit(){var has=Object.keys(db.drafts).some(function(k){return k.indexOf(db.day+'-')===0});return !has||confirm('Editing this day will clear its unsaved sets. Saved workouts remain safe. Continue?')}
function clearDayDrafts(){Object.keys(db.drafts).forEach(function(k){if(k.indexOf(db.day+'-')===0)delete db.drafts[k]})}
function editPlan(action,i){if(!confirmEdit())return;var list=db.plan[db.day].ex,x=list[i],n,s,r,other;if(action==='add'){n=prompt('Exercise name:','');if(n===null||!n.trim())return;s=prompt('Number of sets (1–10):','3');if(s===null)return;r=prompt('Target reps (for example 8–12):','10–12');if(r===null)return;list.push([n.trim().slice(0,90),Math.max(1,Math.min(10,parseInt(s,10)||3)),r.trim().slice(0,24)||'10–12'])}else if(action==='edit'){n=prompt('Exercise name (replace with another exercise here):',x[0]);if(n===null||!n.trim())return;s=prompt('Number of sets (1–10):',x[1]);if(s===null)return;r=prompt('Target reps:',x[2]);if(r===null)return;list[i]=[n.trim().slice(0,90),Math.max(1,Math.min(10,parseInt(s,10)||x[1])),r.trim().slice(0,24)||x[2]]}else if(action==='remove'){if(!confirm('Remove '+x[0]+' from this day? Past history is kept.'))return;list.splice(i,1)}else if(action==='reset'){if(!confirm('Restore original exercises for this day?'))return;db.plan[db.day]=JSON.parse(JSON.stringify(defaults[db.day]))}else if(action==='up'&&i>0){other=list[i-1];list[i-1]=list[i];list[i]=other}else if(action==='down'&&i<list.length-1){other=list[i+1];list[i+1]=list[i];list[i]=other}clearDayDrafts();persist();render()}
function showTimer(){var box=el('timer');if(!timerEnd){box.classList.remove('visible');box.innerHTML='';return}var remaining=Math.ceil((timerEnd-Date.now())/1000);if(remaining<=0){timerEnd=0;box.classList.remove('visible');box.innerHTML='';el('notice').textContent='Rest complete — ready for the next set';return}box.classList.add('visible');box.innerHTML='<div><small style="color:#bce7dc">REST TIMER</small><br><strong>'+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')+'</strong></div><div class="flex"><button data-timer="restart">Restart</button><button data-timer="stop">Stop</button></div>'}
function startTimer(){timerEnd=Date.now()+db.restSeconds*1000;showTimer();if(!timerHandle)timerHandle=setInterval(showTimer,500)}
document.addEventListener('input',function(e){if(e.target.hasAttribute('data-edit'))setDraft(+e.target.getAttribute('data-i'),+e.target.getAttribute('data-j'),e.target.getAttribute('data-edit'),e.target.value)});
document.addEventListener('change',function(e){if(e.target.id==='rest-select'){db.restSeconds=+e.target.value;persist()}if(e.target.id==='chart-ex'){chartName=e.target.value;render()}if(e.target.id==='file'&&e.target.files.length){var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||!Array.isArray(data.sessions)||!data.drafts||typeof data.drafts!=='object')throw Error('Invalid backup');if(data.plan&&!cleanPlan(data.plan))throw Error('Invalid plan');if(confirm('Replace ALL current workout records with this backup? Export current data first if needed.')){db=data;if(!cleanPlan(db.plan))db.plan=JSON.parse(JSON.stringify(defaults));db.day=Math.max(0,Math.min(3,Number(db.day)||0));db.restSeconds=[60,90,120].includes(+db.restSeconds)?+db.restSeconds:90;persist();render()}}catch(err){alert('Could not read this Split Log backup.')}};reader.readAsText(e.target.files[0]);e.target.value=''}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab');render();return}if(b.hasAttribute('data-day')){db.day=+b.getAttribute('data-day');managing=false;persist();render();return}if(b.hasAttribute('data-manage')){managing=!managing;render();return}if(b.hasAttribute('data-add')){editPlan('add');return}if(b.hasAttribute('data-exedit')){editPlan('edit',+b.getAttribute('data-exedit'));return}if(b.hasAttribute('data-remove')){editPlan('remove',+b.getAttribute('data-remove'));return}if(b.hasAttribute('data-resetday')){editPlan('reset');return}if(b.hasAttribute('data-move')){editPlan(b.getAttribute('data-move'),+b.getAttribute('data-i'));return}if(b.hasAttribute('data-month')){var dir=+b.getAttribute('data-month');monthOffset=dir===0?0:monthOffset+dir;render();return}if(b.hasAttribute('data-timer')){if(b.getAttribute('data-timer')==='stop'){timerEnd=0;showTimer()}else startTimer();return}if(b.hasAttribute('data-check')){var i=+b.getAttribute('data-i'),j=+b.getAttribute('data-j'),s=draft(db.day,i,j);if(!s.done&&(s.kg===''||s.reps===''||Number(s.kg)<0||Number(s.reps)<=0)){alert('Enter weight and reps before completing this set. Use 0 kg for bodyweight.');return}setDraft(i,j,'done',!s.done);if(!s.done){}else startTimer();render();return}
if(b.id==='save'){var p=db.plan[db.day],session={date:new Date().toISOString(),dayName:'Day '+(db.day+1)+' · '+p.name,exercises:[]},count=0;p.ex.forEach(function(x,i){var sets=[];for(var j=0;j<x[1];j++){var s=draft(db.day,i,j);if(s.done&&s.reps!==''&&Number(s.reps)>0&&s.kg!==''&&Number(s.kg)>=0){sets.push({kg:Number(s.kg),reps:Number(s.reps)});count++}}if(sets.length)session.exercises.push({name:x[0],sets:sets})});if(!count){alert('Complete at least one set before saving.');return}db.sessions.push(session);clearDayDrafts();persist();timerEnd=0;tab='history';render();alert('Workout saved: '+count+' sets!');return}
if(b.id==='export'){var a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);a.href=url;a.download='split-log-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},10000);return}if(b.id==='import'){el('file').click();return}});
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js').catch(function(){})})}render();
})();</script></body></html>
